<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>形状范围筛选</title>
<style>
  /* ── palettes ─────────────────────────────────────────────────────────── */
  :root {
    --radius: 12px;
    --radius-sm: 8px;
    --gap: 12px;
    --font: "Segoe UI", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, monospace;
    --ease: cubic-bezier(.32, .72, 0, 1);
  }
  html[data-theme="dark"] {
    --bg: #16181d;
    --bg-elev: #1c1f26;
    --card: #21242c;
    --card-2: #272b34;
    --line: #313640;
    --line-soft: #2a2e37;
    --fg: #e8eaf0;
    --fg-dim: #9aa1af;
    --fg-faint: #6b7280;
    --accent: #5b8cff;
    --accent-ink: #ffffff;
    --accent-soft: rgba(91, 140, 255, .16);
    --accent-line: rgba(91, 140, 255, .42);
    --ok: #43d39e;
    --ok-soft: rgba(67, 211, 158, .14);
    --warn: #e8b339;
    --danger: #ff6b6b;
    --thumb-bg: #191c22;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
  html[data-theme="light"] {
    --bg: #f4f6fa;
    --bg-elev: #ffffff;
    --card: #ffffff;
    --card-2: #f2f4f8;
    --line: #dfe3ea;
    --line-soft: #e8ebf1;
    --fg: #1c2230;
    --fg-dim: #5c6675;
    --fg-faint: #8b95a5;
    --accent: #3b6fe0;
    --accent-ink: #ffffff;
    --accent-soft: rgba(59, 111, 224, .10);
    --accent-line: rgba(59, 111, 224, .35);
    --ok: #12a06a;
    --ok-soft: rgba(18, 160, 106, .12);
    --warn: #b57d10;
    --danger: #d64545;
    --thumb-bg: #eef1f6;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 10px 28px -18px rgba(16,24,40,.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  input, select {
    background: var(--card-2); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 6px 9px; outline: none;
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=number] { width: 62px; font-variant-numeric: tabular-nums; }
  input[type=text] { width: 168px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-faint); background-clip: content-box; }
  .hidden { display: none !important; }

  /* ── shell ────────────────────────────────────────────────────────────── */
  .app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: var(--gap);
    padding: 14px 18px; background: var(--bg-elev); border-bottom: 1px solid var(--line);
    flex: none;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .mark {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    background: linear-gradient(145deg, var(--accent), #7aa2ff);
    display: grid; place-items: center; box-shadow: 0 2px 8px -2px var(--accent-line);
  }
  .mark::after { content: ""; width: 11px; height: 11px; border: 2px solid #fff; border-radius: 2px; }
  .brand h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: .2px; }
  .brand .sub { margin: 1px 0 0; font-size: 11px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head-tools { display: flex; align-items: center; gap: 8px; flex: none; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: var(--radius-sm);
    background: var(--card-2); border: 1px solid var(--line); color: var(--fg);
    font-size: 12.5px; font-weight: 500;
    transition: background .14s var(--ease), border-color .14s var(--ease), transform .1s var(--ease);
  }
  .btn:hover:not(:disabled) { background: var(--card); border-color: var(--fg-faint); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .42; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--fg-dim); }
  .btn.ghost:hover:not(:disabled) { background: var(--card-2); color: var(--fg); }

  /* ── controls ─────────────────────────────────────────────────────────── */
  .sheet { padding: 14px 18px 0; flex: none; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .panel + .panel { margin-top: var(--gap); }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
  }
  .panel-head .label {
    font-size: 10.5px; font-weight: 650; letter-spacing: .9px;
    text-transform: uppercase; color: var(--fg-faint);
  }
  .panel-body { padding: 13px 14px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .row + .row { margin-top: 11px; }
  .field { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--fg-dim); }
  .field > .k { color: var(--fg-dim); }
  .sep { width: 1px; height: 20px; background: var(--line); }

  .seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--card-2); border: 1px solid var(--line); border-radius: 9px; }
  .seg button {
    padding: 5px 13px; border-radius: 6px; font-size: 12.5px; font-weight: 550;
    color: var(--fg-dim); transition: background .15s var(--ease), color .15s var(--ease);
  }
  .seg button:hover { color: var(--fg); }
  .seg button.active { background: var(--accent); color: var(--accent-ink); box-shadow: 0 1px 6px -2px var(--accent-line); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 500;
    background: var(--card-2); border: 1px solid var(--line); color: var(--fg-dim);
    transition: all .14s var(--ease);
  }
  .chip:hover { color: var(--fg); border-color: var(--fg-faint); }
  .chip.active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); font-weight: 600; }

  .slider-wrap { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1; height: 4px; padding: 0;
    border: none; border-radius: 99px; background: var(--line); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg-elev); cursor: grab;
    box-shadow: 0 1px 5px rgba(0,0,0,.35); transition: transform .12s var(--ease);
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.14); }
  input[type=range]::-webkit-slider-thumb:active { cursor: grabbing; }
  .tol-readout {
    font: 600 13px/1 var(--mono); color: var(--accent);
    min-width: 52px; text-align: right; font-variant-numeric: tabular-nums;
  }

  /* ── histogram ────────────────────────────────────────────────────────── */
  .histo { position: relative; padding: 4px 0 0; }
  .bars { display: flex; align-items: flex-end; gap: 1px; height: 62px; }
  .bars .bar {
    flex: 1; min-width: 1px; border-radius: 2px 2px 0 0;
    background: var(--line); height: 2px;
    transition: background .16s var(--ease), height .2s var(--ease);
  }
  .bars .bar.hot { background: var(--accent); }
  .bars .bar.zero { background: var(--line-soft); }
  .axis { display: flex; justify-content: space-between; margin-top: 5px; font-size: 10.5px; color: var(--fg-faint); font-family: var(--mono); }
  .axis span { flex: 1; text-align: center; }
  .axis span:first-child { text-align: left; }
  .axis span:last-child { text-align: right; }

  /* ── summary ──────────────────────────────────────────────────────────── */
  .summary {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px 18px; margin-top: var(--gap);
    background: var(--bg-elev); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    flex: none;
  }
  .stat { display: flex; align-items: baseline; gap: 7px; }
  .stat .n { font: 650 20px/1 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
  .stat .n.accent { color: var(--accent); }
  .stat .c { font-size: 11.5px; color: var(--fg-dim); }
  .delta {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    background: var(--ok-soft); color: var(--ok);
  }
  .cond { margin-left: auto; font-size: 11.5px; color: var(--fg-dim); font-family: var(--mono); }

  /* ── actions ──────────────────────────────────────────────────────────── */
  .actions {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 11px 18px; background: var(--bg-elev); border-bottom: 1px solid var(--line); flex: none;
  }
  .actions .spacer { flex: 1; }

  /* ── results ──────────────────────────────────────────────────────────── */
  .results { flex: 1; overflow-y: auto; padding: 16px 18px 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(134px, 1fr)); gap: 12px; }
  .cell {
    position: relative; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; cursor: pointer;
    transition: transform .16s var(--ease), border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .cell:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
  .cell .thumb {
    width: 100%; height: 112px; object-fit: contain; display: block;
    background-color: var(--thumb-bg);
    background-image:
      linear-gradient(45deg, rgba(128,128,128,.09) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.09) 75%),
      linear-gradient(45deg, rgba(128,128,128,.09) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.09) 75%);
    background-size: 14px 14px; background-position: 0 0, 7px 7px;
  }
  .cell .meta { padding: 7px 9px 8px; }
  .cell .dim { font: 600 11.5px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
  .cell .ratio { color: var(--fg-faint); font-weight: 500; }
  .cell .nm { margin-top: 2px; font-size: 11px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    position: absolute; top: 7px; right: 7px; padding: 2px 6px; border-radius: 5px;
    font-size: 10px; font-weight: 650; letter-spacing: .2px;
    background: rgba(20,22,28,.72); color: #ffd9d9; backdrop-filter: blur(3px);
  }
  .badge.caught { background: rgba(20,22,28,.72); color: #b6f2dc; }
  html[data-theme="light"] .badge { background: rgba(255,255,255,.86); color: #b03030; }
  html[data-theme="light"] .badge.caught { background: rgba(255,255,255,.86); color: #0d7a51; }

  /* ── multi-select ─────────────────────────────────────────────────────── */
  .cell .pick {
    position: absolute; top: 7px; left: 7px; width: 18px; height: 18px;
    border-radius: 5px; border: 1.5px solid rgba(255,255,255,.7);
    background: rgba(20,22,28,.45); display: grid; place-items: center;
    transition: background .12s var(--ease), border-color .12s var(--ease), transform .12s var(--ease);
  }
  .cell .pick::after {
    content: ""; width: 9px; height: 5px; opacity: 0;
    border-left: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translate(1px, -2px);
  }
  .cell:hover .pick { border-color: #fff; }
  html[data-theme="light"] .cell .pick { border-color: rgba(28,34,48,.45); background: rgba(255,255,255,.7); }
  html[data-theme="light"] .cell .pick::after { border-color: #fff; }
  .cell.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .cell.selected .pick { background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
  .cell.selected .pick::after { opacity: 1; }

  .target {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px; border-radius: 999px; font-size: 11.5px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .target.none { background: var(--card-2); color: var(--fg-dim); font-weight: 500; }
  .ext-chip { font-variant-numeric: tabular-nums; }
  .ext-chip .c { opacity: .6; margin-left: 5px; font-size: 11px; }

  .skeleton { border-radius: 10px; background: var(--card-2); height: 156px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: .9; } }
  .more { display: block; margin: 18px auto 0; }

  .empty { display: grid; place-items: center; gap: 8px; padding: 56px 20px; text-align: center; color: var(--fg-dim); }
  .empty .big { font-size: 26px; opacity: .5; }
  .empty .t { font-size: 13px; font-weight: 600; color: var(--fg); }
  .empty .s { font-size: 12px; max-width: 420px; }

  /* ── status bar ───────────────────────────────────────────────────────── */
  footer {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 18px; background: var(--bg-elev); border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--fg-dim); flex: none;
  }
  footer .err { color: var(--danger); font-weight: 600; }
  footer .grow { flex: 1; }
  .spin {
    width: 12px; height: 12px; border-radius: 50%; flex: none;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--line-soft); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .18s var(--ease); }
  .app { position: relative; }
</style>
</head>
<body>
<div class="app">
  <div class="progress hidden" id="progressWrap"><i id="progressBar"></i></div>

  <header>
    <div class="brand">
      <span class="mark"></span>
      <div style="min-width:0">
        <h1>形状范围筛选</h1>
        <p class="sub" id="libName">正在读取资源库…</p>
      </div>
    </div>
    <div class="head-tools">
      <label class="field"><span class="k">范围</span>
        <select id="scope">
          <option value="all">整个资源库</option>
          <option value="selected">当前选中</option>
          <option value="folder">指定文件夹…</option>
        </select>
      </label>
      <select id="folderPick" class="hidden" style="max-width:200px"></select>
      <button class="btn primary hidden" id="btnPickLib" title="自动定位失败时手动选择 .library 文件夹">指定资源库…</button>
      <button class="btn" id="btnRescan" title="忽略缓存,重新读取资源库">重新扫描</button>
    </div>
  </header>

  <div class="sheet">
    <div class="panel">
      <div class="panel-head">
        <span class="label">匹配条件</span>
        <span class="field"><span class="k">方向</span>
          <select id="orientation">
            <option value="any">横竖均可</option>
            <option value="landscape">仅横图</option>
            <option value="portrait">仅竖图</option>
          </select>
        </span>
      </div>
      <div class="panel-body">
        <div class="row">
          <div class="seg" id="modeSeg">
            <button data-mode="near" class="active">近似比例</button>
            <button data-mode="range">长宽比区间</button>
          </div>
          <span class="sep"></span>
          <div class="chips" id="presets"></div>
        </div>

        <div class="row" id="nearRow">
          <span class="field"><span class="k">目标比例</span>
            <input id="cw" type="number" min="1" step="1" value="1"> :
            <input id="ch" type="number" min="1" step="1" value="1">
          </span>
          <span class="sep"></span>
          <span class="field"><span class="k">容差</span>
            <span class="slider-wrap">
              <input id="tol" type="range" min="0" max="25" step="0.5" value="5">
            </span>
            <input id="tolNum" type="number" min="0" max="50" step="0.5" value="5" style="width:58px">
            <span class="tol-readout" id="tolReadout">±5.0%</span>
          </span>
        </div>

        <div class="row hidden" id="rangeRow">
          <span class="field"><span class="k">最小长宽比</span><input id="minR" type="number" step="0.01" min="0" value="0.95"></span>
          <span class="field"><span class="k">最大长宽比</span><input id="maxR" type="number" step="0.01" min="0" value="1.05"></span>
          <span style="font-size:11.5px;color:var(--fg-faint)">比值恒按「宽 ÷ 高」；方向选「横竖均可」时会双向比较</span>
        </div>

        <div class="row" id="extRow">
          <span class="k" style="font-size:12px;color:var(--fg-dim)">格式</span>
          <div class="chips" id="extChips"></div>
          <span id="extHint" style="font-size:11.5px;color:var(--fg-faint)"></span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="label">长宽比分布</span>
        <span class="label" id="histoInfo" style="text-transform:none;letter-spacing:0">—</span>
      </div>
      <div class="panel-body" style="padding-bottom:11px">
        <div class="histo">
          <div class="bars" id="histo"></div>
          <div class="axis">
            <span>1:4</span><span>1:2</span><span>1:1</span><span>2:1</span><span>4:1</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="actions">
    <button class="btn primary" id="btnSelect" disabled>在 Eagle 中选中</button>
    <button class="btn" id="btnTag" disabled>打标签</button>
    <input id="tagName" type="text" placeholder="标签名,如 近似方形">
    <span class="sep"></span>
    <button class="btn" id="btnCopy" disabled>复制路径</button>
    <button class="btn" id="btnExport" disabled>导出清单</button>
    <span class="sep"></span>
    <span class="target none" id="targetInfo">—</span>
    <button class="btn ghost" id="btnPickAll" disabled title="选中当前全部结果">全选</button>
    <button class="btn ghost" id="btnPickInvert" disabled title="反选">反选</button>
    <button class="btn ghost hidden" id="btnPickNone" title="清空选择">清空选择</button>
    <span class="spacer"></span>
    <button class="btn ghost" id="btnClear" title="清空条件">重置条件</button>
  </div>

  <div class="results" id="results">
    <div class="grid" id="grid"></div>
    <button class="btn more hidden" id="btnMore"></button>
  </div>

  <footer>
    <span id="status">就绪</span>
    <span class="grow"></span>
    <span id="hint">原生形状筛选只能精确匹配;这里可按容差与区间筛选</span>
  </footer>
</div>

<script src="js/matcher.js"></script>
<script src="js/indexer.js"></script>
<script src="js/plugin.js"></script>
</body>
</html>
